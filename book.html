<body>

<header>

    <a href="index.html" class="logo"><img src="assets/logo.svg" alt="Growfar" width="54" height="54"></a>
  </div>
</header>

<main>
  <div class="hero">
    <div class="wrap lp-center">
      <span class="pill-tag">Free strategy call</span>
      <h1>Let's plan your content.</h1>
      <p class="lead">Answer five quick questions, pick a time that suits you, and your custom quote will be ready before we talk.</p>
      <a href="#contact" data-book class="btn btn-fill">Book a Call</a>
    </div>
  </div>

<footer class="lp-foot">

  </div>

<script src="booking.js"></script>
<script>
  // Meta Pixel: Book a Call (and other #contact) button clicks
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('a[href="#contact"]');
    if (!btn || typeof fbq !== 'function') return;
    fbq('trackCustom', 'BookCallClick', {
      button_text: btn.textContent.trim()
    });
  });
  // This page exists as an ad destination: open the form straight away so the
  // click lands directly on question 1, no extra "Book a Call" click needed.
  window.addEventListener('load', function () {
    window.GFBooking && window.GFBooking.open();
  });
</script>
